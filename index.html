<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Garden Shop – Dashboard de Estoque (Stlite)</title>
  <!-- Stlite shim (WebAssembly) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@stlite/shim@2.0.0-beta.12/dist/stlite.js"></script>
  <style>
    html, body, #root { margin:0; height:100%; width:100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const root = document.getElementById('root');
    // Stlite will serve the current directory (.) as a virtual file system.
    // It will find app.py, requirements.txt, src/ and the CSV folder.
    stlite.mount(root, { startUrl: '.' });
  </script>
</body>
</html>
