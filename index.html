# ── Build consolidated DataFrame ──────────────────────────────────────────────
@st.cache_data
def build_data():
    products    = pd.read_csv(io.StringIO(PRODUCTS_CSV))
    categories  = pd.read_csv(io.StringIO(CATEGORIES_CSV))
    suppliers   = pd.read_csv(io.StringIO(SUPPLIERS_CSV))
    orders      = pd.read_csv(io.StringIO(ORDERS_CSV))
    order_items = pd.read_csv(io.StringIO(ORDER_ITEMS_CSV))

    # Types
    products["discontinued"]    = products["discontinued"].astype(str).str.lower().isin(["true","1","yes"])
    products["cost"]             = pd.to_numeric(products["cost"],             errors="coerce")
    products["price"]            = pd.to_numeric(products["price"],            errors="coerce")
    products["quantity_on_hand"] = pd.to_numeric(products["quantity_on_hand"], errors="coerce").fillna(0).astype(int)
    products["reorder_level"]    = pd.to_numeric(products["reorder_level"],    errors="coerce").fillna(0).astype(int)

    # Supplier email
    if "contact_email" in suppliers.columns:
        suppliers = suppliers.rename(columns={"contact_email": "email"})
    suppliers["email"] = suppliers["email"].fillna("Nao informado").replace("", "Nao informado")

    # Sales (exclude cancelled) — REQ-002
    valid_orders = orders[orders["status"].str.lower() != "cancelled"]
    merged       = order_items.merge(valid_orders[["order_id"]], on="order_id", how="inner")
    sales = (
        merged.groupby("product_id")
        .agg(units_sold=("quantity", "sum"),
             revenue=("unit_price", lambda x: (merged.loc[x.index, "quantity"] * x).sum()))
        .reset_index()
    )

    # Join — REQ-006: exactly 24 rows
    df = products.merge(categories,  on="category_id",  how="left")
    df = df.merge(suppliers,         on="supplier_id",  how="left")
    df = df.merge(sales,             on="product_id",   how="left")
    df["units_sold"] = df["units_sold"].fillna(0).astype(int)
    df["revenue"]    = df["revenue"].fillna(0.0)

    # Rename category_name collision
    if "category_name_x" in df.columns:
        df = df.rename(columns={"category_name_x": "category_name"})
    if "category_name_y" in df.columns:
        df = df.drop(columns=["category_name_y"])

    # Cost value — REQ-003
    df["total_cost_value"] = (df["quantity_on_hand"] * df["cost"]).round(2)

    # Alert classification — REQ-004
    def classify(row):
        if row["discontinued"]:
            return "Descontinuado"
        qoh, lvl = row["quantity_on_hand"], row["reorder_level"]
        if qoh == 0:
            return "Ruptura"
        ratio = qoh / lvl if lvl != 0 else float("inf")
        if ratio < 0.5:  return "Critico"
        if ratio < 1.0:  return "Alerta"
        if ratio <= 1.5: return "Observacao"
        return "Adequado"

    df["alert_status"] = df.apply(classify, axis=1)

    # Deficit — REQ-005
    def deficit(row):
        if row["discontinued"] or row["quantity_on_hand"] >= row["reorder_level"]:
            return 0
        return int(row["reorder_level"] - row["quantity_on_hand"])

    df["reorder_deficit"] = df.apply(deficit, axis=1)
    df = df.rename(columns={"email": "supplier_email"})
    return df
